<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- upper bearing shell (half-moon, opening down) -->
    <path d="M 32 108 A 88 88 0 0 1 208 108 L 184 108 A 64 64 0 0 0 56 108 Z" fill="#f2f2f2" stroke-width="4"/>
    <!-- steel-back / lining boundary line, upper -->
    <path d="M 50 108 A 70 70 0 0 1 190 108" fill="none" stroke-width="3"/>
    <!-- locating tab notch, upper shell right parting face -->
    <path d="M 188 108 L 188 99 L 197 99 L 197 108 Z" fill="#ffffff" stroke-width="3"/>
    <!-- lower bearing shell (half-moon, opening up) -->
    <path d="M 32 132 A 88 88 0 0 0 208 132 L 184 132 A 64 64 0 0 1 56 132 Z" fill="#f2f2f2" stroke-width="4"/>
    <!-- steel-back / lining boundary line, lower -->
    <path d="M 50 132 A 70 70 0 0 0 190 132" fill="none" stroke-width="3"/>
    <!-- locating tab notch, lower shell left parting face -->
    <path d="M 43 132 L 43 141 L 52 141 L 52 132 Z" fill="#ffffff" stroke-width="3"/>
    <!-- oil hole at crown (red accent) -->
    <circle cx="120" cy="32" r="6.5" fill="#ffffff" stroke="#da291c" stroke-width="3.5"/>
  </g>
</svg>
