<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- ring side wall (3/4 view thickness) -->
    <path d="M 24 112 L 24 126 A 96 64 0 0 0 216 126 L 216 112" fill="#e3e3e3" stroke-width="4"/>
    <!-- torus top face -->
    <ellipse cx="120" cy="112" rx="96" ry="64" fill="#f2f2f2" stroke-width="4"/>
    <!-- inner bore -->
    <ellipse cx="120" cy="116" rx="52" ry="28" fill="#ffffff" stroke-width="4"/>
    <!-- tube roundness contour, lower band -->
    <path d="M 74 160 A 70 40 0 0 0 166 160" fill="none" stroke-width="3"/>
    <!-- highlight arc on the tube (red accent) -->
    <path d="M 48 84 A 92 60 0 0 1 86 60" fill="none" stroke="#da291c" stroke-width="4"/>
  </g>
</svg>
