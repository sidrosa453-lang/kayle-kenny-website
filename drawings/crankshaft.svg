<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- front snout -->
    <rect x="15" y="112" width="27" height="16" rx="3" fill="#ffffff"/>
    <!-- main journals -->
    <rect x="40" y="105" width="12" height="30" rx="2" fill="#ffffff"/>
    <rect x="92" y="105" width="12" height="30" rx="2" fill="#ffffff"/>
    <rect x="144" y="105" width="12" height="30" rx="2" fill="#ffffff"/>
    <rect x="196" y="105" width="12" height="30" rx="2" fill="#ffffff"/>
    <!-- rear flange -->
    <rect x="206" y="93" width="18" height="54" rx="4" fill="#e3e3e3"/>
    <!-- crank pins: up, down, up -->
    <rect x="58" y="79" width="28" height="18" rx="4" fill="#ffffff"/>
    <rect x="110" y="143" width="28" height="18" rx="4" fill="#ffffff"/>
    <rect x="162" y="79" width="28" height="18" rx="4" fill="#ffffff"/>
    <!-- webs -->
    <rect x="50" y="73" width="12" height="61" rx="3" fill="#f2f2f2"/>
    <rect x="82" y="73" width="12" height="61" rx="3" fill="#f2f2f2"/>
    <rect x="102" y="106" width="12" height="61" rx="3" fill="#f2f2f2"/>
    <rect x="134" y="106" width="12" height="61" rx="3" fill="#f2f2f2"/>
    <rect x="154" y="73" width="12" height="61" rx="3" fill="#f2f2f2"/>
    <rect x="186" y="73" width="12" height="61" rx="3" fill="#f2f2f2"/>
    <!-- counterweights opposite each pin -->
    <rect x="46.5" y="128" width="19" height="43" rx="7" fill="#f2f2f2"/>
    <rect x="78.5" y="128" width="19" height="43" rx="7" fill="#f2f2f2"/>
    <rect x="98.5" y="69" width="19" height="43" rx="7" fill="#f2f2f2"/>
    <rect x="130.5" y="69" width="19" height="43" rx="7" fill="#f2f2f2"/>
    <rect x="150.5" y="128" width="19" height="43" rx="7" fill="#f2f2f2"/>
    <rect x="182.5" y="128" width="19" height="43" rx="7" fill="#f2f2f2"/>
    <!-- pin oil holes -->
    <circle cx="72" cy="88" r="3.5" fill="#ffffff" stroke-width="3"/>
    <circle cx="124" cy="152" r="3.5" fill="#ffffff" stroke-width="3"/>
    <circle cx="176" cy="88" r="3.5" fill="#ffffff" stroke-width="3"/>
    <!-- red keyway on snout -->
    <rect x="20" y="112" width="13" height="5" rx="1.5" fill="#da291c" stroke-width="3"/>
  </g>
</svg>
