<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- case side wall (3/4 view thickness) -->
    <path d="M 25 106 L 25 130 A 95 60 0 0 0 215 130 L 215 106" fill="#e3e3e3" stroke-width="4"/>
    <!-- outer metal case, top face -->
    <ellipse cx="120" cy="106" rx="95" ry="60" fill="#f2f2f2" stroke-width="4"/>
    <!-- rubber element bonded inside the case -->
    <ellipse cx="120" cy="106" rx="78" ry="47" fill="#e3e3e3" stroke-width="3"/>
    <!-- sealing lip edge -->
    <ellipse cx="120" cy="106" rx="60" ry="35" fill="none" stroke-width="3"/>
    <!-- garter spring hint (red accent) -->
    <ellipse cx="120" cy="106" rx="53" ry="30" fill="none" stroke="#da291c" stroke-width="3.5" stroke-dasharray="2 8"/>
    <!-- shaft bore -->
    <ellipse cx="120" cy="106" rx="44" ry="24" fill="#ffffff" stroke-width="4"/>
  </g>
</svg>
