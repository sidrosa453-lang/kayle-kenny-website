<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- liner body (sleeve barrel) -->
  <path d="M58 74 L58 194 A62 16 0 0 0 182 194 L182 74 A78 20 0 0 1 58 74 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- flange lip side band -->
  <path d="M42 48 L42 62 A78 20 0 0 0 198 62 L198 48 A78 20 0 0 1 42 48 Z" fill="#e3e3e3" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- flange top face -->
  <ellipse cx="120" cy="48" rx="78" ry="20" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="4"/>
  <!-- inner bore opening -->
  <ellipse cx="120" cy="48" rx="56" ry="14" fill="#e3e3e3" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- depth cue inside bore -->
  <path d="M70 53 A50 12 0 0 1 170 53" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- O-ring seal grooves near lower end -->
  <path d="M58 158 A62 16 0 0 0 182 158" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 172 A62 16 0 0 0 182 172" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- red crevice seal O-ring accent -->
  <path d="M58 165 A62 16 0 0 0 182 165" fill="none" stroke="#da291c" stroke-width="4" stroke-linecap="round"/>
</svg>
