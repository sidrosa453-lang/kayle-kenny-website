<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- upper (grooved) main bearing shell -->
    <path d="M 28 112 A 92 92 0 0 1 212 112 L 180 112 A 60 60 0 0 0 60 112 Z" fill="#f2f2f2" stroke-width="4"/>
    <!-- circumferential oil groove across the upper shell -->
    <path d="M 39 112 A 81 81 0 0 1 201 112 L 195 112 A 75 75 0 0 0 45 112 Z" fill="#e3e3e3" stroke-width="3"/>
    <!-- locating tab notch, upper shell right parting face -->
    <path d="M 185 112 L 185 103 L 194 103 L 194 112 Z" fill="#ffffff" stroke-width="3"/>
    <!-- lower (plain) main bearing shell -->
    <path d="M 28 128 A 92 92 0 0 0 212 128 L 180 128 A 60 60 0 0 1 60 128 Z" fill="#f2f2f2" stroke-width="4"/>
    <!-- steel-back / lining boundary line, lower -->
    <path d="M 54 128 A 66 66 0 0 0 186 128" fill="none" stroke-width="3"/>
    <!-- locating tab notch, lower shell left parting face -->
    <path d="M 46 128 L 46 137 L 55 137 L 55 128 Z" fill="#ffffff" stroke-width="3"/>
    <!-- oil feed hole in the groove at the crown (red accent) -->
    <circle cx="120" cy="34" r="6" fill="#ffffff" stroke="#da291c" stroke-width="3.5"/>
  </g>
</svg>
